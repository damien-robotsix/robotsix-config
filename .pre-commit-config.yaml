repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: 3e8a8703264a2f4a69428a0aa4dcb512790b2c8c  # frozen: v6.0.0  # pragma: allowlist secret
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-added-large-files
      - id: check-case-conflict
      - id: check-json
      - id: check-merge-conflict
      - id: detect-private-key
      - id: debug-statements
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: aab412d509121cb5f7533134b7e67f9fab59c682  # frozen: v0.16.4  # pragma: allowlist secret
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format
  - repo: https://github.com/abravalheri/validate-pyproject
    rev: 4b2e70d08cb2ccd26d1fba73588de41c7a5d50b7  # frozen: v0.25  # pragma: allowlist secret
    hooks:
      - id: validate-pyproject
        additional_dependencies: ["validate-pyproject-schema-store[all]"]
  - repo: https://github.com/igorshubovych/markdownlint-cli
    rev: 5b5dddc4fb0f83c3ea1fc5616fa63e115dce83e0  # v0.49.1
    hooks:
      - id: markdownlint
  - repo: https://github.com/PyCQA/bandit
    rev: 92ae8b82fb422a639f0ed8d99e96cea769594e08  # frozen: 1.9.4  # pragma: allowlist secret
    hooks:
      - id: bandit
        args: ["-c", "pyproject.toml"]
        # bandit's pre-commit hook does not pull [tool.bandit] from
        # pyproject.toml unless pointed at it explicitly.
  - repo: https://github.com/Yelp/detect-secrets
    rev: 68e8b45440415753fff70a312ece8da92ba85b4a  # frozen: v1.5.0  # pragma: allowlist secret
    hooks:
      - id: detect-secrets
        args: ["--baseline", ".secrets.baseline"]
  - repo: https://github.com/zizmorcore/zizmor-pre-commit
    rev: 451b56af716f9f0d0c2b816503a3fd0cf8b036fa  # v1.29.0
    hooks:
      - id: zizmor
  - repo: https://github.com/rhysd/actionlint
    rev: 914e7df21a07ef503a81201c76d2b11c789d3fca  # v1.7.12
    hooks:
      - id: actionlint
  - repo: local
    hooks:
      - id: mypy
        name: mypy
        entry: uv run mypy src tests
        language: system
        pass_filenames: false

  - repo: local
    hooks:
      - id: vulture
        name: vulture
        entry: vulture src/
        language: system
        pass_filenames: false

  - repo: local
    hooks:
      - id: robotsix-modules-validate
        name: robotsix-modules-validate
        entry: robotsix-modules-validate
        language: system
        files: ^(src|tests|scripts|docs)/
        pass_filenames: false
        args: [docs/robotsix_config/modules.yaml]

  - repo: local
    hooks:
      - id: robotsix-modules-check-registration
        name: robotsix-modules-check-registration
        entry: uv run robotsix-modules check-registration docs/robotsix_config/modules.yaml --root .
        language: system
        files: ^(src|tests|scripts|docs)/
        pass_filenames: false
