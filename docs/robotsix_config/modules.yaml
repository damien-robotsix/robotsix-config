modules:
  - id: robotsix-config
    description: Core robotsix-config package with configuration loading, dumping, and history tracking.
    paths:
      - src/robotsix_config/__init__.py
      - src/robotsix_config/__main__.py
      - src/robotsix_config/cli.py
      - src/robotsix_config/py.typed
      - src/robotsix_config/history.py
      - src/robotsix_config/_deprecation.py
      - tests/robotsix_config/__init__.py
      - tests/robotsix_config/test_history.py
      - tests/robotsix_config/test_deprecations.py
      - tests/robotsix_config/test_docs_examples.py
      - docs/robotsix_config/api.md
      - docs/robotsix_config/contributing.md
      - docs/robotsix_config/index.md
      - docs/robotsix_config/modules.yaml
      - docs/robotsix_config/security.md
      - scripts/check_py_typed.py
  - id: config
    description: Configuration models, schema generation, and config file loading/dumping.
    paths:
      - src/robotsix_config/config/__init__.py
      - docs/config/index.md
      - scripts/check_schema_freshness.py
      - tests/config/__init__.py
      - tests/config/test_config.py
      - tests/config/test_config.schema.json
      - tests/config/test_config_properties.py
      - tests/config/scripts/__init__.py
      - tests/config/scripts/_test_cli_models.py
      - tests/config/scripts/_test_models.py
      - tests/config/scripts/test_check_schema_freshness.py
      - tests/config/scripts/test_cli.py
  - id: errors
    description: Error types for configuration validation failures.
    paths:
      - src/robotsix_config/_errors/__init__.py
      - docs/_errors/index.md
      - tests/_errors/__init__.py
      - tests/_errors/test_errors.py
  - id: tests
    description: Test infrastructure and shared fixtures.
    paths:
      - tests/__init__.py
      - tests/conftest.py
