name: CodeQL

on:
  push:
  pull_request:
  schedule:
    - cron: "30 1 * * 0"

permissions:
  contents: read

jobs:
  codeql:
    permissions:
      contents: read
      security-events: write  # Required to upload SARIF results to the security tab
    uses: damien-robotsix/robotsix-github-workflows/.github/workflows/codeql.yml@188518bece972d7d5f1c4e2a0f2226d2526dc0fa  # main 2026-07-04
    with:
      languages: python
