name: CodeQL

on:
  push:
  pull_request:
  schedule:
    - cron: "30 1 * * 0"

permissions:
  contents: read

jobs:
  codeql:
    permissions:
      contents: read
      security-events: write  # Required to upload SARIF results to the security tab
    uses: damien-robotsix/robotsix-github-workflows/.github/workflows/codeql.yml@d2a2353830cf211a9f18f3585085016766294dff  # main 2026-07-04
    with:
      languages: python
