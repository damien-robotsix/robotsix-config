name: Docs
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  docs:
    permissions:
      contents: read
      pages: write  # needed to deploy to GitHub Pages
      id-token: write  # needed for OIDC token to authenticate Pages deployment
    uses: damien-robotsix/robotsix-github-workflows/.github/workflows/python-docs.yml@f6219bfc4b1d44b8d574a7ea022882a2edba1c6c  # main
    with:
      docs-install-args: "--extra docs"
