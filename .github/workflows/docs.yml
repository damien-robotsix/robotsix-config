name: Docs
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  docs:
    permissions:
      contents: read
      pages: write  # needed to deploy to GitHub Pages
      id-token: write  # needed for OIDC token to authenticate Pages deployment
    uses: damien-robotsix/robotsix-github-workflows/.github/workflows/python-docs.yml@86a722f2938c1dda343bbf8d3c5989613cbf1794  # v1.5.0
    with:
      docs-install-args: "--extra docs"
