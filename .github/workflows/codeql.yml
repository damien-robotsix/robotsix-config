name: CodeQL

on:
  push:
  pull_request:
  schedule:
    - cron: "30 1 * * 0"

permissions:
  contents: read

jobs:
  codeql:
    permissions:
      contents: read
      security-events: write  # Required to upload SARIF results to the security tab
    uses: damien-robotsix/robotsix-github-workflows/.github/workflows/codeql.yml@f6219bfc4b1d44b8d574a7ea022882a2edba1c6c  # main 2026-07-04
    with:
      languages: python
