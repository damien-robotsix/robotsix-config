name: CI

on:
  push:
  pull_request:

concurrency:
  group: >-
    ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  ci:
    permissions:
      contents: read
      security-events: write  # needed for SARIF upload
    uses: damien-robotsix/robotsix-github-workflows/.github/workflows/python-ci.yml@86a722f2938c1dda343bbf8d3c5989613cbf1794  # v1.5.0
    with:
      python-version: "3.14"
      install-extras: "dev"
      cov-package: robotsix_config
      coverage-threshold: "90"
      run-deptry: true
      # bandit runs once, in the `bandit-sarif` job below, which also feeds
      # code scanning (the spine's bandit step emits no SARIF).
      run-bandit: false
      run-vulture: true
      vulture-args: "src/"
      # Replaces the former inline `dependency-audit` job: uv audit with a
      # SARIF upload to code scanning (needs the security-events grant above).
      audit-sarif: true
      check-lock: true
      mypy-advisory: false

  cross-platform-tests:
    name: Cross-platform tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1  # v2.21.1
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v6
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d  # v10.0.1
        with:
          python-version: "3.14"

      - run: uv sync --locked --extra dev
        env:
          UV_MALWARE_CHECK: "1"

      - run: uv run pytest -n auto

  security:
    permissions:
      contents: read
      security-events: write  # Bandit SARIF upload in python-security.yml
    uses: damien-robotsix/robotsix-github-workflows/.github/workflows/python-security.yml@86a722f2938c1dda343bbf8d3c5989613cbf1794  # v1.5.0
    with:
      python-version: "3.14"
      install-extras: "dev"
      # TruffleHog's Lob detector matches `test_`-prefixed 40-character
      # strings. This repo's CHANGELOG.md is full of mill ticket slugs of
      # exactly that shape — e.g.
      # `20260720T202339Z-test-gap-add-unit-tests-for-scripts-chec-b673` —
      # so the whole-repo scan reports 9 "verified" Lob keys on every PR.
      # They are ticket ids, not credentials, and the fleet does not use
      # Lob (a print/mail API). Excluding the one detector keeps the job
      # meaningful; leaving it on trains everyone to ignore a red check.
      trufflehog-extra-args: "--exclude-detectors=lob"

# auto-release deliberately does NOT live here. changelog-driven-releases.md
# specifies it runs "weekly (and on demand)", so it belongs in its own
# scheduled workflow — see .github/workflows/auto-release.yml. As a per-push
# job in CI it also failed every commit: it pinned a reusable-workflow
# revision whose required `release-token` secret this repo does not have, and
# a missing required secret is a startup failure that reds the whole run.

  baseline-check:
    permissions:
      contents: read
    uses: damien-robotsix/robotsix-github-workflows/.github/workflows/baseline-check.yml@86a722f2938c1dda343bbf8d3c5989613cbf1794  # v1.5.0

  # ruff check / ruff format --check run inside the `ci` job (python-ci.yml),
  # and actionlint + zizmor run in lint-workflows.yml, so neither is repeated
  # here. This job stays because it also type-checks tests/ (the spine runs
  # mypy on src/ only).
  mypy:
    name: Mypy type check
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1  # v2.21.1
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v6
        with:
          persist-credentials: false

      - uses: $/.github/actions/setup

      - name: mypy src and tests
        run: uv run mypy src tests

  check-modules:
    name: Check module registration
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1  # v2.21.1
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v6
        with:
          persist-credentials: false

      - uses: $/.github/actions/setup

      - name: Validate module taxonomy
        run: uv run robotsix-modules validate docs/robotsix_config/modules.yaml

      - name: Check module registration
        run: uv run robotsix-modules check-registration docs/robotsix_config/modules.yaml --root .

  check-schema:
    name: Check schema freshness
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1  # v2.21.1
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v6
        with:
          persist-credentials: false

      - uses: $/.github/actions/setup

      # `uv run`, not bare `python`: the bare interpreter is the runner's
      # system Python, which has none of the project dependencies, so this
      # step failed with `ModuleNotFoundError: No module named 'pydantic'`.
      # Every other job in this file already goes through `uv run`.
      - name: Check schema freshness
        run: PYTHONPATH=src:. uv run python scripts/check_schema_freshness.py --model tests.config.test_config.MailConfig --output tests/config/test_config.schema.json

  check-py-typed:
    name: Check py.typed wheel marker
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1  # v2.21.1
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v6
        with:
          persist-credentials: false

      - uses: $/.github/actions/setup

      - name: Check py.typed marker
        run: python scripts/check_py_typed.py

  docs-build:
    name: Build docs
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1  # v2.21.1
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v6
        with:
          persist-credentials: false

      - uses: $/.github/actions/setup

      - name: Build docs (strict mode)
        run: PYTHONPATH=src uv run mkdocs build --strict

  # The reusable spine's bandit step does not emit a SARIF file or upload it,
  # so bandit runs here instead (the `ci` job sets run-bandit: false to avoid
  # running it twice): this job is both the bandit gate and the code-scanning
  # integration.
  bandit-sarif:
    name: Bandit SARIF upload
    permissions:
      contents: read
      security-events: write  # needed for SARIF upload
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1  # v2.21.1
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v6
        with:
          persist-credentials: false

      - uses: $/.github/actions/setup

      - name: bandit
        run: uvx --from 'bandit[sarif]' bandit -c pyproject.toml -r src/ -f sarif -o bandit-results.sarif

      - name: Upload bandit SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@db488ddef3bf6cb639b32c2e9a7c0a7ea8271d28  # v4
        with:
          sarif_file: bandit-results.sarif
          category: bandit

  # The reusable spine (python-ci.yml v1.5.0) writes coverage.xml and uploads
  # it as the `coverage-data` artifact, so this job only forwards that report
  # to Codecov instead of re-running the test suite.
  coverage:
    name: Coverage & Codecov upload
    needs: ci
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1  # v2.21.1
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v6
        with:
          persist-credentials: false

      - name: Download coverage report
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: coverage-data

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5  # v7
        with:
          files: ./coverage.xml
          fail_ci_if_error: false
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  dependency-review:
    name: Dependency review
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
      pull-requests: write  # shared workflow posts the review summary as a PR comment
    uses: damien-robotsix/robotsix-github-workflows/.github/workflows/dependency-review.yml@47523e8aa2d34d41da060d29b57f75ab262cb840  # v1.4.0
    with:
      fail-on-severity: moderate

  sbom-release:
    name: Generate and attach SBOM
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write       # needed for uploading to the GitHub Release
      id-token: write       # needed for attestation
      attestations: write   # needed for attestation
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1  # v2.21.1
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v6
        with:
          persist-credentials: false

      - uses: $/.github/actions/setup

      - name: Generate CycloneDX SBOM
        run: uv run --with cyclonedx-py cyclonedx-py environment --output-file sbom.cyclonedx.json

      - name: Upload SBOM to release
        run: gh release upload "$TAG_NAME" sbom.cyclonedx.json
        env:
          TAG_NAME: ${{ github.ref_name }}
          GITHUB_TOKEN: ${{ github.token }}

      - name: Attest SBOM
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6  # v4.2.2
        with:
          subject-path: sbom.cyclonedx.json
          predicate-type: "https://cyclonedx.org/schema"

