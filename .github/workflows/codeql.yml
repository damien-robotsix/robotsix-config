name: CodeQL

on:
  push:
  pull_request:
  schedule:
    - cron: "30 1 * * 0"

permissions:
  contents: read

jobs:
  codeql:
    permissions:
      contents: read
      security-events: write  # Required to upload SARIF results to the security tab
    uses: damien-robotsix/robotsix-github-workflows/.github/workflows/codeql.yml@86a722f2938c1dda343bbf8d3c5989613cbf1794  # v1.5.0
    with:
      languages: python
      config-file: .github/codeql/codeql-config.yml
